# File-based H2 database (data persists between runs in ./data/database.mv.db)
spring.datasource.url=jdbc:h2:file:./data/database;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# H2 web console to inspect the database: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.thymeleaf.cache=false

server.port=${PORT:8080}

# Product photos are stored as bytes in the database (see Product.photoData), not on disk —
# this keeps them intact across deploys on hosts with ephemeral/no persistent disk.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
