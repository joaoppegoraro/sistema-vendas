# File-based H2 database (data persists between runs in ./data/database.mv.db)
spring.datasource.url=jdbc:h2:file:./data/database;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# H2 web console to inspect the database: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.thymeleaf.cache=false

server.port=${PORT:8080}

# Product photos are stored as bytes in the database (see Product.photoData), not on disk —
# this keeps them intact across deploys on hosts with ephemeral/no persistent disk.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# College project delivery gate (see LimitedScopeFilter): when true, only Clients and Suppliers
# are reachable — nav links to the rest are hidden and direct URLs redirect to /clients. Flip to
# false once the next delivery's scope is graded/screenshotted.
app.limited-scope=true

# Login (see SecurityConfig): the whole app sits behind a single account, since it holds real
# client/supplier data at a public URL. APP_PASSWORD has no default on purpose — the app refuses
# to start without it, so a real password always has to be set explicitly (never committed).
# Locally: export APP_PASSWORD before running the jar. In production (Render): set APP_USERNAME
# and APP_PASSWORD as environment variables there.
app.security.username=${APP_USERNAME:vendedora}
app.security.password=${APP_PASSWORD}
