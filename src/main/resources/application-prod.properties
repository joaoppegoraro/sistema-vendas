# Active only when SPRING_PROFILES_ACTIVE=prod (set as an env var on the host).
# Connects to a managed Postgres instance (e.g. Neon) instead of the local H2 file,
# since production hosts with a free tier typically have no persistent disk.
spring.datasource.url=${DATABASE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# No point exposing a DB browser console in production.
spring.h2.console.enabled=false

spring.thymeleaf.cache=true
