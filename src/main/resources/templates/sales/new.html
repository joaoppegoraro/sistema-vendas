<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(title='Nova venda')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="container page">
    <div class="page-header">
        <div>
            <span class="eyebrow">PDV</span>
            <h1>Nova venda</h1>
        </div>
        <a class="button button-secondary" th:href="@{/sales}">Ver vendas</a>
    </div>

    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

    <div class="pdv-layout">
        <section class="pdv-picker">
            <h2>Adicionar item</h2>
            <input type="text" id="variantSearch" placeholder="Buscar produto por nome..." />
            <select id="variantSelect" size="8">
                <option th:each="v : ${sellableVariants}"
                        th:value="${v.id}"
                        th:text="${v.productName} + ' - ' + ${v.label} + ' (' + ${v.availableQuantity} + ' disponível)'"
                        th:attr="data-search=${#strings.toLowerCase(v.productName + ' ' + v.label)}"></option>
            </select>
            <p class="field-hint" th:if="${#lists.isEmpty(sellableVariants)}">Nenhum produto com estoque disponível.</p>
            <div class="form-row">
                <div class="field">
                    <label for="variantQuantity">Quantidade</label>
                    <input type="number" id="variantQuantity" min="1" value="1" />
                </div>
            </div>
            <button type="button" id="addToCartButton" class="button button-primary">Adicionar ao carrinho</button>
            <p id="cartActionError" class="field-error"></p>
        </section>

        <section class="pdv-cart">
            <div id="cart-section" th:replace="~{::cartSection}"></div>

            <form class="form" th:action="@{/sales}" method="post" id="finalizeForm">
                <div class="field">
                    <label for="clientId">Cliente (opcional)</label>
                    <select id="clientId" name="clientId">
                        <option value="">Sem cliente</option>
                        <option th:each="c : ${clients}" th:value="${c.id}" th:text="${c.name}"></option>
                    </select>
                </div>
                <div class="form-row">
                    <div class="field">
                        <label for="discount">Desconto (R$)</label>
                        <input id="discount" type="number" step="0.01" min="0" name="discount" value="0" />
                    </div>
                    <div class="field">
                        <label for="surcharge">Acréscimo (R$)</label>
                        <input id="surcharge" type="number" step="0.01" min="0" name="surcharge" value="0" />
                    </div>
                </div>
                <div class="field">
                    <label for="paymentMethod">Forma de pagamento</label>
                    <select id="paymentMethod" name="paymentMethod">
                        <option th:each="pm : ${paymentMethods}" th:value="${pm}" th:text="${pm.label}"></option>
                    </select>
                </div>
                <div class="pdv-total">Total estimado: <strong id="totalDisplay">R$ 0,00</strong></div>
                <div class="form-actions">
                    <button type="submit" class="button button-primary">Finalizar venda</button>
                </div>
            </form>
        </section>
    </div>
</main>
<script th:src="@{/js/pdv.js}"></script>
</body>
</html>

<div id="cart-section" th:fragment="cartSection" th:attr="data-subtotal=${cartSubtotal}">
    <p class="field-error" th:if="${cartError}" th:text="${cartError}"></p>
    <table class="data-table" th:if="${not #lists.isEmpty(cart)}">
        <thead>
            <tr>
                <th>Produto</th>
                <th>Qtd.</th>
                <th>Subtotal</th>
                <th></th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="item : ${cart}">
                <td>
                    <div th:text="${item.productName}"></div>
                    <span class="text-soft" th:text="${item.variantLabel}"></span>
                </td>
                <td th:text="${item.quantity}"></td>
                <td th:text="${item.formattedSubtotal}"></td>
                <td>
                    <button type="button" class="icon-btn icon-delete remove-cart-item" th:attr="data-variant-id=${item.variantId}" aria-label="Remover item" title="Remover item">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
                    </button>
                </td>
            </tr>
        </tbody>
    </table>
    <p class="empty-state" th:if="${#lists.isEmpty(cart)}">Nenhum item no carrinho ainda.</p>
    <p class="pdv-subtotal" th:if="${not #lists.isEmpty(cart)}">Subtotal: <strong th:text="${cartSubtotalFormatted}"></strong></p>
</div>
