<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(title='Início')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="container page home">
    <div class="page-header">
        <div>
            <h1>Gestão do Vendedor</h1>
            <p class="text-soft">Sistema de gestão de vendas.</p>
        </div>
        <a class="button button-primary" th:href="@{/sales/new}">+ Nova venda</a>
    </div>

    <div class="stat-cards">
        <div class="stat-card">
            <div class="stat-card-label">Faturamento Bruto do mês</div>
            <div class="stat-card-value" th:text="${summary.formattedMonthlyRevenue}"></div>
        </div>
        <div class="stat-card">
            <div class="stat-card-label">Lucro Líquido do mês</div>
            <div class="stat-card-value" th:text="${summary.formattedMonthlyProfit}"></div>
        </div>
        <div class="stat-card">
            <div class="stat-card-label">Patrimônio em estoque</div>
            <div class="stat-card-value" th:text="${summary.formattedStockValue}"></div>
        </div>
    </div>

    <h2>Top 5 produtos mais vendidos</h2>
    <table class="data-table" th:if="${not #lists.isEmpty(summary.topProducts)}">
        <thead>
            <tr>
                <th>Produto</th>
                <th>Unidades vendidas</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="product : ${summary.topProducts}">
                <td th:text="${product.productName}"></td>
                <td th:text="${product.totalSold}"></td>
            </tr>
        </tbody>
    </table>
    <p class="empty-state" th:if="${#lists.isEmpty(summary.topProducts)}">Nenhuma venda registrada ainda.</p>
</main>
</body>
</html>
