<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(title=${client.name})}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="container page">
    <div class="page-header">
        <div>
            <span class="eyebrow">Cadastro</span>
            <h1 th:text="${client.name}">Cliente</h1>
        </div>
        <div class="actions">
            <a class="button button-secondary" th:href="@{/clients}">Voltar</a>
            <a class="button button-primary" th:href="@{'/clients/' + ${client.id} + '/edit'}">Editar</a>
        </div>
    </div>

    <div class="form">
        <p>
            <strong>CPF:</strong> <span th:text="${client.formattedCpf}"></span><br/>
            <strong>E-mail:</strong> <span th:text="${client.email} ?: '-'"></span><br/>
            <strong>Telefone:</strong> <span th:text="${client.phone} ?: '-'"></span>
            <a th:if="${client.whatsAppUrl}" th:href="${client.whatsAppUrl}" target="_blank" rel="noopener" class="button button-secondary whatsapp-link">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M12.04 2c-5.46 0-9.9 4.44-9.9 9.9 0 1.75.46 3.45 1.32 4.95L2 22l5.25-1.38a9.9 9.9 0 0 0 4.79 1.22h.01c5.46 0 9.9-4.44 9.9-9.9S17.5 2 12.04 2zm0 18.1c-1.5 0-2.97-.4-4.25-1.16l-.3-.18-3.11.82.83-3.03-.2-.31a8.1 8.1 0 0 1-1.24-4.34c0-4.48 3.65-8.13 8.14-8.13a8.1 8.1 0 0 1 8.13 8.13c0 4.48-3.65 8.13-8.13 8.13h-.07z"/></svg>
                Abrir WhatsApp
            </a><br/>
            <strong>Endereço:</strong> <span th:text="${client.address} ?: '-'"></span><br/>
            <strong>Aniversário:</strong> <span th:text="${client.formattedBirthDate} ?: '-'"></span><br/>
            <strong>Cliente desde:</strong> <span th:text="${#temporals.format(client.registrationDate, 'dd/MM/yyyy')}"></span>
        </p>

        <form th:action="@{'/clients/' + ${client.id} + '/delete'}" method="post"
              data-confirm="Você tem certeza que deseja remover cliente?">
            <button type="submit" class="link-danger">Excluir cliente</button>
        </form>
    </div>

    <h2 style="margin-top: 32px;">Histórico de compras</h2>
    <table class="data-table" th:if="${not #lists.isEmpty(purchases)}">
        <thead>
            <tr>
                <th>Data</th>
                <th>Itens</th>
                <th>Pagamento</th>
                <th>Total</th>
                <th>Status</th>
                <th></th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="sale : ${purchases}">
                <td th:text="${sale.formattedSaleDate}"></td>
                <td>
                    <span th:each="item, iter : ${sale.items}">
                        <span th:text="${item.quantity} + 'x ' + ${item.productName}"></span><span th:if="${!iter.last}">, </span>
                    </span>
                </td>
                <td th:text="${sale.paymentMethodLabel}"></td>
                <td th:text="${sale.formattedTotal}"></td>
                <td>
                    <span class="badge badge-success" th:if="${sale.status.name() == 'COMPLETED'}" th:text="${sale.statusLabel}"></span>
                    <span class="badge badge-low-stock" th:if="${sale.status.name() == 'CANCELLED'}" th:text="${sale.statusLabel}"></span>
                </td>
                <td>
                    <div class="actions">
                        <a th:href="@{'/sales/' + ${sale.id}}" class="icon-btn icon-view" aria-label="Ver venda" title="Ver venda">
                            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        </a>
                    </div>
                </td>
            </tr>
        </tbody>
    </table>

    <div class="pagination" th:if="${purchasePage.totalPages > 1}">
        <a th:if="${!purchasePage.first}" th:href="@{'/clients/{id}'(id=${client.id}, page=${purchasePage.number - 1})}" class="button button-secondary">Anterior</a>
        <span class="pagination-info">Página <span th:text="${purchasePage.number + 1}"></span> de <span th:text="${purchasePage.totalPages}"></span></span>
        <a th:if="${!purchasePage.last}" th:href="@{'/clients/{id}'(id=${client.id}, page=${purchasePage.number + 1})}" class="button button-secondary">Próxima</a>
    </div>

    <p class="empty-state" th:if="${#lists.isEmpty(purchases)}">Este cliente ainda não fez nenhuma compra.</p>
</main>
</body>
</html>
